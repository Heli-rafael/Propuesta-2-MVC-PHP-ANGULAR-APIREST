<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="iniciosesion.css" />
</head>
<body>
    <div class="container">
        <!-- Contenedor del login -->
        <div class="login-box">
            <h2>Bienvenido a EventosC</h2>
            <p class="subtitle">Ingresa tus credenciales para continuar</p>

            <!-- Inputs sin formulario -->
            <div class="input-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" [(ngModel)]="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" [(ngModel)]="contrasena" placeholder="••••••••" required>
            </div>

            <!-- Botón que llama directamente a la función -->
            <button class="btn" (click)="iniciarSesion()">Iniciar sesión</button>

            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

            <!-- Mostrar error si existe -->
            <p *ngIf="error" class="error">{{ error }}</p>
        </div>

        <!-- Contenedor de la imagen -->
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80" alt="Login Image">
        </div>
    </div>
</body>
</html>
<p-toast></p-toast>
